<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoChiefs - Taurus Oracle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cinzel', serif;
            background: linear-gradient(135deg, #1a1410 0%, #2d2416 100%);
            color: #d4af37;
            overflow-x: hidden;
        }

        .oracle-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Avatar Stage */
        #avatar-stage {
            width: 800px;
            height: 600px;
            border: 3px solid #8b6914;
            border-radius: 8px;
            background: radial-gradient(circle, rgba(212,175,55,0.1) 0%, rgba(0,0,0,0.8) 100%);
            box-shadow: 0 0 40px rgba(212,175,55,0.3);
            position: relative;
        }

        /* Oracle Header */
        .oracle-header {
            position: absolute;
            top: 20px;
            text-align: center;
            width: 100%;
            z-index: 10;
        }

        .oracle-header h1 {
            font-size: 48px;
            text-shadow: 0 0 20px rgba(212,175,55,0.8);
            letter-spacing: 4px;
        }

        .oracle-header .subtitle {
            font-size: 18px;
            color: #b8960f;
            margin-top: 8px;
            letter-spacing: 2px;
        }

        /* Subtitles */
        .oracle-subtitles {
            position: absolute;
            bottom: 80px;
            width: 100%;
            text-align: center;
            padding: 0 40px;
        }

        #oracle-subtitles {
            font-size: 20px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.6);
            padding: 12px 24px;
            border-radius: 8px;
            display: inline-block;
            min-height: 60px;
        }

        /* Control Panel */
        .control-panel {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 16px;
            z-index: 10;
        }

        .oracle-button {
            background: linear-gradient(135deg, #8b6914 0%, #d4af37 100%);
            color: #1a1410;
            border: 2px solid #d4af37;
            padding: 12px 28px;
            font-size: 16px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .oracle-button:hover {
            background: linear-gradient(135deg, #d4af37 0%, #f4cf67 100%);
            box-shadow: 0 0 20px rgba(212,175,55,0.6);
            transform: translateY(-2px);
        }

        .oracle-button:active {
            transform: translateY(0);
        }

        /* Input Panel */
        .input-panel {
            position: absolute;
            top: 120px;
            width: 90%;
            max-width: 700px;
            background: rgba(26,20,16,0.9);
            border: 2px solid #8b6914;
            border-radius: 8px;
            padding: 20px;
            display: none;
            z-index: 20;
        }

        .input-panel.active {
            display: block;
        }

        .input-panel textarea {
            width: 100%;
            min-height: 100px;
            background: rgba(45,36,22,0.9);
            border: 1px solid #8b6914;
            color: #d4af37;
            font-family: 'Cinzel', serif;
            font-size: 16px;
            padding: 12px;
            border-radius: 4px;
            resize: vertical;
        }

        .input-panel textarea::placeholder {
            color: #8b6914;
        }

        .input-panel button {
            margin-top: 12px;
        }

        /* Status Indicator */
        .status-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #b8960f;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4caf50;
            box-shadow: 0 0 10px rgba(76,175,80,0.8);
        }

        .status-dot.inactive {
            background: #666;
            box-shadow: none;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .loading-overlay.hidden {
            display: none;
        }

        .loading-content {
            text-align: center;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #8b6914;
            border-top: 4px solid #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="oracle-container">
        <!-- Header -->
        <div class="oracle-header">
            <h1>TAURUS ORACLE</h1>
            <div class="subtitle">Chief Guardian of Value & Stewardship</div>
        </div>

        <!-- Status -->
        <div class="status-indicator">
            <div class="status-dot" id="status-dot"></div>
            <span id="status-text">Initializing...</span>
        </div>

        <!-- Avatar Stage -->
        <div id="avatar-stage"></div>

        <!-- Subtitles -->
        <div class="oracle-subtitles">
            <div id="oracle-subtitles">I consecrate value for all who walk the earth.</div>
        </div>

        <!-- Input Panel -->
        <div class="input-panel" id="input-panel">
            <textarea id="question-input" placeholder="Seek wisdom from the Taurus Oracle..."></textarea>
            <button class="oracle-button" onclick="submitQuestion()">Consult Oracle</button>
            <button class="oracle-button" onclick="closeInput()">Cancel</button>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <button class="oracle-button" onclick="consultOracle()">Consult Oracle</button>
            <button class="oracle-button" onclick="requestGuidance()">Request Guidance</button>
            <button class="oracle-button" onclick="viewInsights()">View Insights</button>
        </div>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loading-overlay">
            <div class="loading-content">
                <div class="spinner"></div>
                <div style="font-size: 24px; color: #d4af37;">Loading Taurus Avatar...</div>
            </div>
        </div>
    </div>

    <!-- TalkingHead Library -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import { TaurusAvatarStage } from './src/lib/card/taurusSdk.js';

        let taurus = null;

        // Initialize on load
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                updateStatus('Initializing Taurus Avatar...', false);

                // Create Taurus Avatar Stage
                taurus = new TaurusAvatarStage('avatar-stage', {
                    modelPath: '/assets/taurus/taurus-meshy-v1.glb',
                    cameraView: 'upper',
                    avatarMood: 'neutral'
                });

                await taurus.init();

                // Hide loading
                document.getElementById('loading-overlay').classList.add('hidden');
                updateStatus('Oracle Active', true);

                // Initial greeting
                setTimeout(() => {
                    taurus.speak("Greetings, seeker. I am Taurus, Chief Guardian of Value and Stewardship. How may I guide you today?");
                }, 1000);

            } catch (error) {
                console.error('Failed to initialize:', error);
                updateStatus('Initialization Failed', false);
                document.getElementById('oracle-subtitles').textContent =
                    'Failed to load Taurus Avatar. Check console for details.';
            }
        });

        // Update status indicator
        function updateStatus(text, active) {
            document.getElementById('status-text').textContent = text;
            const dot = document.getElementById('status-dot');
            if (active) {
                dot.classList.remove('inactive');
            } else {
                dot.classList.add('inactive');
            }
        }

        // Button handlers
        window.consultOracle = function() {
            document.getElementById('input-panel').classList.add('active');
            document.getElementById('question-input').focus();
        };

        window.closeInput = function() {
            document.getElementById('input-panel').classList.remove('active');
            document.getElementById('question-input').value = '';
        };

        window.submitQuestion = async function() {
            const question = document.getElementById('question-input').value.trim();
            if (!question) return;

            closeInput();

            try {
                updateStatus('Oracle Consulting...', true);
                await taurus.consultOracle(question, (response) => {
                    console.log('Oracle Response:', response);
                });
                updateStatus('Oracle Active', true);
            } catch (error) {
                console.error('Consultation failed:', error);
                updateStatus('Oracle Active', true);
            }
        };

        window.requestGuidance = async function() {
            if (!taurus || !taurus.isReady) return;

            const guidance = [
                "Balance your resources as you balance the scales of justice.",
                "Stewardship is not ownership, but sacred trust.",
                "The Terra Ledger remembers all - make each entry count.",
                "Prosperity flows from patient cultivation, not hasty harvest."
            ];

            const wisdom = guidance[Math.floor(Math.random() * guidance.length)];
            await taurus.speak(wisdom);
        };

        window.viewInsights = function() {
            alert('Scroll Ledger insights would appear here.\n\nIntegrate with your Terra Ledger API.');
        };

        // Handle Enter key in textarea
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('question-input')?.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    submitQuestion();
                }
            });
        });
    </script>
</body>
</html>
