<!DOCTYPE html>
<html>
<head>
  <title>Talking Head - Animal Example</title>

  <style>
    body, html { width:100%; height:100%; max-width: 800px; margin: auto; position: relative; background-color: #202020; color: white; }
    #avatar { display: block; width:100%; height:100%; }
    #loading { display: block; position: absolute; bottom: 10px; left: 10px; right: 10px; height: 50px; font-family: Arial; font-size: 20px; }
  </style>

  <script type="importmap">
  { "imports":
    {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "talkinghead": "../modules/talkinghead.mjs"
    }
  }
  </script>

  <script type="module">
    import { TalkingHead } from "talkinghead";

    let head;

    document.addEventListener('DOMContentLoaded', async function(e) {

      const nodeAvatar = document.getElementById('avatar');
      head = new TalkingHead( nodeAvatar, {
        ttsEndpoint: "https://eu-texttospeech.googleapis.com/v1beta1/text:synthesize",
        lipsyncModules: ["en"],
        cameraView: "upper" // Good for waist-up animals
      });

      // Load and show the animal avatar
      const nodeLoading = document.getElementById('loading');
      try {
        nodeLoading.textContent = "Loading Animal Avatar...";

        // Note: For this to work with a custom animal rig,
        // the library must be patched as described in TALKING_ANIMALS.md
        await head.showAvatar( {
          url: 'path/to/your/animal.glb',
          body: 'M',
          avatarMood: 'neutral',
          lipsyncLang: 'en',

          // Using DynamicBones for animal features
          modelDynamicBones: [
            {
              bone: "Ear_L", // Custom bone name in your animal rig
              type: "link",
              stiffness: 0.5,
              damping: 0.5
            },
            {
              bone: "Ear_R",
              type: "link",
              stiffness: 0.5,
              damping: 0.5
            },
            {
              bone: "Tail_1",
              type: "link",
              stiffness: 0.2,
              damping: 0.3
            }
          ]
        }, (ev) => {
          if ( ev.lengthComputable ) {
            let val = Math.min(100,Math.round(ev.loaded/ev.total * 100 ));
            nodeLoading.textContent = "Loading " + val + "%";
          }
        });
        nodeLoading.style.display = 'none';
      } catch (error) {
        console.log(error);
        nodeLoading.textContent = "Error: " + error.message + " (Check TALKING_ANIMALS.md for bone requirements)";
      }

    });

  </script>
</head>

<body>
  <div id="avatar"></div>
  <div id="loading"></div>
</body>

</html>
